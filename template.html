<title>Chronicle of Ages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a cartographer's desk — the atlas fills the left, the annals scroll on the right; on phones the map sits above the annals. */
:root {
  --bg: #e4e7ec;          /* cool slate paper */
  --panel: #f2f3f6;
  --panel-2: #e9ebf0;
  --fg: #1c2330;
  --muted: #5d6677;
  --line: #c6ccd7;
  --accent: #8c5a14;      /* brass, darkened for paper */
  --accent-soft: #e9d9b6;
  --accent-fg: #ffffff;
  --warn: #a32f26;
  --map-bg: #1b3350;
  --tl-bar: rgba(163, 47, 38, 0.55);
  --shadow: 0 1px 2px rgba(20, 30, 50, 0.12), 0 8px 24px rgba(20, 30, 50, 0.10);
  --is-dark: 0;
  --font-display: "Alegreya SC", "Alegreya", Georgia, "Times New Roman", serif;
  --font-body: "Alegreya", Georgia, "Times New Roman", serif;
  --font-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181f; --panel: #1d2129; --panel-2: #232833; --fg: #e4e6ea; --muted: #99a2b1; --line: #343b48;
    --accent: #d2a64c; --accent-soft: #3a3121; --accent-fg: #15181f; --warn: #e2665c; --map-bg: #0e1a2b; --tl-bar: rgba(226, 102, 92, 0.6);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35); --is-dark: 1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181f; --panel: #1d2129; --panel-2: #232833; --fg: #e4e6ea; --muted: #99a2b1; --line: #343b48;
  --accent: #d2a64c; --accent-soft: #3a3121; --accent-fg: #15181f; --warn: #e2665c; --map-bg: #0e1a2b; --tl-bar: rgba(226, 102, 92, 0.6);
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35); --is-dark: 1; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input { font-family: var(--font-ui); font-size: 14px; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

/* ---- top bar ---- */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: 0.04em; }
.seedline { font-family: var(--font-ui); color: var(--muted); font-size: 13px; }
.seedline b { color: var(--fg); font-weight: 500; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 6px 12px; line-height: 1.2; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: 0.6; cursor: default; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.speed button { border: 0; background: transparent; padding: 6px 9px; color: var(--muted); border-right: 1px solid var(--line); }
.speed button:last-child { border-right: 0; }
.speed button.active { background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.yearbox { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); }
.yearbox .lbl { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-ui); }
.yearbox #yearNum { font-size: 26px; font-weight: 700; min-width: 3ch; font-variant-numeric: tabular-nums; }
#seedForm { display: flex; gap: 6px; }
#seedInput { width: 160px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--panel-2); }

/* ---- desk ---- */
.desk { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); min-height: 0; }
.atlas { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 12px 10px 16px; gap: 8px; }
.mapwrap { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--map-bg); box-shadow: var(--shadow); }
#map { display: block; touch-action: none; cursor: crosshair; }
.mapbtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.mapbtns button { width: 30px; height: 30px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.35); background: rgba(250,246,236,0.9); color: #1d1711; font-weight: 700; font-size: 15px; }
.mapbtns button#zoomFit { font-size: 11px; letter-spacing: 0.05em; }
.legend { position: absolute; left: 10px; bottom: 8px; font-family: var(--font-ui); font-size: 11.5px; color: #f6f1e4; text-shadow: 0 1px 2px rgba(0,0,0,0.8); display: flex; gap: 12px; flex-wrap: wrap; pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.tooltip { position: absolute; max-width: 230px; background: rgba(28, 24, 20, 0.93); color: #f6f1e4; font-family: var(--font-ui); font-size: 13px; line-height: 1.35; padding: 7px 10px; border-radius: 4px; pointer-events: none; z-index: 2; }
.tooltip b { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.02em; }
.timeline { position: relative; height: 44px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
#tlCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#tl { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
#tl::-webkit-slider-runnable-track { height: 100%; background: transparent; }
#tl::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 4px; height: 44px; background: var(--accent); border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,0.3); }
#tl::-moz-range-track { height: 100%; background: transparent; }
#tl::-moz-range-thumb { width: 4px; height: 44px; background: var(--accent); border: 0; border-radius: 1px; }
.tlrow { display: flex; align-items: center; gap: 8px; }
.tlrow .timeline { flex: 1; }
.tlrow .btn { padding: 4px 8px; }
.statline { font-family: var(--font-ui); color: var(--muted); font-size: 13.5px; min-height: 1.4em; }
.hint { font-family: var(--font-ui); color: var(--muted); font-size: 12px; }

/* ---- annals ---- */
.annals { position: relative; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 11px 6px 9px; font-family: var(--font-display); font-size: 15px; letter-spacing: 0.08em; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.filters button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.filters button.active { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
.filters #warChip { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; min-height: 0; padding: 6px 14px 16px; overscroll-behavior: contain; }
.yearhead { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 16px 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.yearhead:first-child { margin-top: 4px; }
.entry { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 9px; align-items: start; padding: 4px 0; }
.entry p { margin: 0; font-size: 15.5px; line-height: 1.4; }
.entry.imp3 p { font-weight: 500; }
.entry.imp0 p { color: var(--muted); font-style: italic; }
.entry.k-battle p, .entry.k-war p, .entry.k-fall p { }
.entry .sw { margin-top: 7px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.35); flex: none; }
.sw.none { background: transparent; border-style: dashed; border-color: var(--line); }
.sw.big { width: 18px; height: 18px; margin-top: 4px; }
a.ref { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
a.ref:hover { color: var(--accent); border-bottom-color: var(--accent); }
a.ref-c { font-weight: 500; }
a.ref-p { }
a.ref-w, a.ref-a { font-style: italic; }
a.ref.hl { background: var(--accent-soft); }
.empty, .endnote { color: var(--muted); font-style: italic; }
#extendRow { margin: 18px 0 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.realm, .fig { display: grid; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 8px 8px; border-radius: 4px; gap: 2px 10px; grid-template-columns: 12px minmax(0, 1fr); font-family: var(--font-body); color: inherit; }
.realm:hover, .fig:hover { background: var(--panel-2); }
.realm.sel { border-color: var(--accent); background: var(--accent-soft); }
.realm .sw, .fig .sw { grid-row: 1 / span 4; grid-column: 1; margin-top: 6px; width: 12px; height: 12px; }
.realm > span:not(.sw), .fig > span:not(.sw) { grid-column: 2; min-width: 0; }
.rname, .fname { font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
.rmeta, .fmeta, .fsum { font-family: var(--font-ui); font-size: 12.5px; color: var(--muted); }
.rmeta em.warn { color: var(--warn); font-style: normal; font-weight: 700; }
.rruler { font-size: 14px; }
.rnums { font-family: var(--font-ui); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rnums b { color: var(--fg); font-weight: 600; margin-right: 1px; }
.realm.dead { opacity: 0.75; }
.realm.dead .sw { opacity: 0.6; }
.fallen summary { font-family: var(--font-display); letter-spacing: 0.06em; color: var(--muted); cursor: pointer; margin: 12px 0 6px; }
.fsum { font-size: 13px; color: var(--fg); opacity: 0.85; }

/* detail overlay */
.pane.detail { padding-top: 10px; }
.filters #btnBackRealm { border-color: transparent; font-weight: 700; color: var(--accent); }
.filters #btnCopyText { margin-left: auto; border-style: dashed; }
.filters #btnBackRealm:not([hidden]) + #btnCopyText { margin-left: 0; }
.dhead { display: flex; gap: 10px; align-items: flex-start; }
.dhead h3 { font-family: var(--font-display); font-size: 20px; margin: 0; line-height: 1.2; }
.dhead > div { flex: 1; min-width: 0; }
.dmeta { margin: 2px 0 0; color: var(--muted); font-family: var(--font-ui); font-size: 13px; }
.dactions { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
.dstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dstats div { min-width: 0; }
.dstats dt { font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.dstats dd { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dsec { margin: 12px 0; }
.dsec h4 { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.dsec p, .dsec ul, .dsec ol { margin: 0; font-size: 15px; }
.dsec ul { padding-left: 18px; }
.rulers { list-style: none; padding: 0; }
.rulers li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; border-bottom: 1px dotted var(--line); flex-wrap: wrap; }
.rulers li.dyn { font-family: var(--font-display); color: var(--muted); font-size: 13px; letter-spacing: 0.06em; border-bottom: 0; margin-top: 6px; }
.rulers .yrs, .wars .yrs { font-family: var(--font-ui); color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.rulers .tr { font-family: var(--font-ui); color: var(--muted); font-size: 12px; margin-left: auto; font-style: italic; }
.wars { list-style: none; padding: 0; }
.wars li { padding: 2px 0; border-bottom: 1px dotted var(--line); }
.popchart { width: 100%; height: 70px; display: block; }
.towns { line-height: 1.6; }

/* loading */
.loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
.loadcard { width: min(440px, 90vw); text-align: center; }
.loadtitle { font-family: var(--font-display); font-size: 24px; letter-spacing: 0.06em; margin-bottom: 14px; }
.bar { height: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
#loadbar { height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }
#loadmsg { margin-top: 10px; font-family: var(--font-ui); color: var(--muted); font-size: 13.5px; min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { #loadbar { transition: none; } }

/* phones */
@media (max-width: 860px) {
  #app { height: auto; min-height: 100%; }
  .top { padding: 10px 16px; gap: 10px; }
  .controls { margin-left: 0; width: 100%; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .atlas { padding: 10px 16px 6px; }
  .mapwrap { aspect-ratio: 4 / 3; flex: none; height: auto; }
  .hint { display: none; }
  .legend { display: none; }
  .annals { border-left: 0; border-top: 1px solid var(--line); height: 70vh; }
  .brand { width: 100%; }
}
</style>
<div id="app">
  <header class="top">
    <div class="brand"><h1>Chronicle of Ages</h1><span class="seedline">world of <b id="seedName"></b></span></div>
    <div class="controls">
      <button id="btnPlay" class="btn primary" aria-pressed="false">Play</button>
      <div class="speed" role="group" aria-label="Years per second"><button data-speed="1">1×</button><button data-speed="3" class="active">3×</button><button data-speed="8">8×</button><button data-speed="20">20×</button></div>
      <div class="yearbox"><span class="lbl">Year</span><span id="yearNum">1</span></div>
      <form id="seedForm"><input id="seedInput" name="seed" placeholder="seed" aria-label="World seed" autocomplete="off" spellcheck="false"><button class="btn" type="submit">Forge</button></form>
      <button id="btnRandom" class="btn">Random world</button>
      <button id="btnCopySeed" class="btn small">Copy seed</button>
    </div>
  </header>
  <main class="desk">
    <section class="atlas">
      <div class="mapwrap">
        <canvas id="map" aria-label="Map of the world"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <div class="mapbtns"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomFit" aria-label="Fit map">FIT</button></div>
        <div class="legend"><span><i style="background:#c8322b"></i>battle</span><span><i style="background:#2a0a0a;border:1px solid #c8322b"></i>realm falls</span><span><i style="background:#d4a43a"></i>town founded</span><span><i style="background:#8a4bb0"></i>plague</span><span><i style="background:#f0c446"></i>wonder</span></div>
      </div>
      <div class="tlrow"><button id="btnStart" class="btn small" aria-label="Go to first year">|◀</button><div class="timeline"><canvas id="tlCanvas"></canvas><input type="range" id="tl" min="1" max="500" value="1" aria-label="Year"></div><button id="btnEnd" class="btn small" aria-label="Go to last year">▶|</button></div>
      <div class="statline" id="statline"></div>
      <div class="hint">Drag to pan, scroll to zoom, click a realm or town. Space plays, arrow keys step years.</div>
    </section>
    <aside class="annals">
      <nav class="tabs"><button data-tab="chronicle" class="active">Chronicle</button><button data-tab="realms">Realms</button><button data-tab="figures">Figures</button></nav>
      <div class="filters" id="filters"><button data-filter="all" class="active">All</button><button data-filter="major">Major</button><button data-filter="wars">Wars</button><button data-filter="lore">Lore</button><button data-filter="realm" hidden>This realm</button><button id="warChip" hidden></button><button id="btnBackRealm" class="back" hidden></button><button id="btnCopyText" class="copy" title="Copy the chronicle shown here as plain text">Copy text</button></div>
      <div class="pane" id="pane-chronicle"></div>
      <div class="pane" id="pane-realms" hidden></div>
      <div class="pane" id="pane-figures" hidden></div>
      <div class="pane detail" id="pane-detail" hidden></div>
    </aside>
  </main>
  <div id="loading" class="loading"><div class="loadcard"><div class="loadtitle">Forging the world</div><div class="bar"><div id="loadbar"></div></div><div id="loadmsg"></div></div></div>
</div>
